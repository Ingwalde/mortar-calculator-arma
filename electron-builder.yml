appId: com.mortar-tablet.app
productName: Планшет мінометника
directories:
  output: dist
  buildResources: build
electronLanguages:
  - uk
  - en-US
# sharp ставиться готовими бінарниками (@img/*): перекомпіляція нативних модулів при пакуванні не потрібна
npmRebuild: false
# запобіжники Electron (закривають зайві шляхи запуску коду): без ELECTRON_RUN_AS_NODE, --inspect і NODE_OPTIONS;
# застосунок вантажиться лише з app.asar, цілісність asar перевіряється при старті
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
compression: maximum
files:
  - out/**/*
  # автономна веб-збірка (сайт/APK) не входить у ПК-застосунок
  - "!out/web/**"
  - resources/**/*
  - package.json
  # зайве з залежностей: звіти покриття, браузерні збірки, вихідники, документація, типи
  - "!**/node_modules/pngjs/coverage/**"
  - "!**/node_modules/node-forge/dist/**"
  - "!**/node_modules/node-forge/flash/**"
  - "!**/node_modules/sharp/src/**"
  - "!**/node_modules/sharp/install/**"
  - "!**/node_modules/**/{test,tests,__tests__,docs,example,examples,.github}/**"
  - "!**/node_modules/**/*.{md,markdown,map,ts,tsx,mts,cts,flow,yml,yaml}"
  - "!**/node_modules/**/{CHANGELOG*,CONTRIBUTING*,README*,.npmignore,.eslintrc*,.travis.yml}"
asarUnpack:
  - "**/node_modules/sharp/**"
  - "**/node_modules/@img/**"
win:
  target:
    - target: portable
      arch: [x64]
    - target: nsis
      arch: [x64]
publish:
  provider: github
  owner: Ingwalde
  repo: mortar-tablet
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  artifactName: MortarTablet-Setup-${version}.${ext}
portable:
  artifactName: MortarTablet-${version}-portable.${ext}
mac:
  target:
    - target: dmg
      arch: [x64, arm64]
  category: public.app-category.utilities
linux:
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  category: Utility
