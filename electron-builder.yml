appId: com.mortar-tablet.app
productName: Планшет мінометника
directories:
  output: dist
  buildResources: build
electronLanguages:
  - uk
  - en-US
# sharp ставиться готовими бінарниками (@img/*): перекомпіляція нативних модулів при пакуванні не потрібна
npmRebuild: false
# запобіжники Electron (закривають зайві шляхи запуску коду): без ELECTRON_RUN_AS_NODE, --inspect і NODE_OPTIONS;
# застосунок вантажиться лише з app.asar, цілісність asar перевіряється при старті
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
compression: maximum
files:
  - out/**/*
  # автономна веб-збірка (сайт/APK) не входить у ПК-застосунок
  - "!out/web/**"
  - resources/**/*
  - package.json
  - LICENSE
  - THIRD-PARTY-NOTICES.md
  - legal/**/*
  # зайве з залежностей: звіти покриття, браузерні збірки, вихідники, документація, типи
  - "!**/node_modules/pngjs/coverage/**"
  - "!**/node_modules/node-forge/dist/**"
  - "!**/node_modules/node-forge/flash/**"
  - "!**/node_modules/sharp/src/**"
  - "!**/node_modules/sharp/install/**"
  - "!**/node_modules/**/{test,tests,__tests__,docs,example,examples,.github}/**"
  # Preserve LICENSE.md, COPYING, NOTICE and README licensing information.
  - "!**/node_modules/**/*.{map,ts,tsx,mts,cts,flow,yml,yaml}"
  - "!**/node_modules/**/{CHANGELOG*,CONTRIBUTING*,.npmignore,.eslintrc*,.travis.yml}"
asarUnpack:
  - "**/node_modules/sharp/**"
  - "**/node_modules/@img/**"
extraResources:
  # Keep legal documents readable without extracting app.asar.
  - from: legal
    to: legal
  - from: LICENSE
    to: legal/APPLICATION-LICENSE.txt
  - from: THIRD-PARTY-NOTICES.md
    to: legal/THIRD-PARTY-NOTICES.md
  - from: resources/legal/npm-notices.txt
    to: legal/npm-notices.txt
win:
  target:
    - target: portable
      arch: [x64]
    - target: nsis
      arch: [x64]
publish:
  provider: github
  owner: Ingwalde
  repo: mortar-tablet
nsis:
  # майстер з вибором папки, без прав адміністратора й без питання «для всіх користувачів» (build/installer.nsh)
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  # першим вікном вибирається мова (українська або англійська); решту тексту майстра перекладає NSIS
  multiLanguageInstaller: true
  displayLanguageSelector: true
  installerLanguages:
    - uk_UA
    - en_US
  installerSidebar: build/installerSidebar.bmp
  uninstallerSidebar: build/installerSidebar.bmp
  runAfterFinish: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  artifactName: MortarTablet-Setup-${version}.${ext}
portable:
  artifactName: MortarTablet-${version}-portable.${ext}
mac:
  target:
    - target: dmg
      arch: [x64, arm64]
  category: public.app-category.utilities
  artifactName: MortarTablet-${version}-mac-${arch}.${ext}
linux:
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  category: Utility
  maintainer: Ingwald <gdimas0603@gmail.com>
  artifactName: MortarTablet-${version}-linux-${arch}.${ext}
