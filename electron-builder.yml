appId: com.mortar-tablet.app
productName: Планшет мінометника
directories:
  output: dist
  buildResources: build
electronLanguages:
  - uk
  - en-US
compression: maximum
files:
  - out/**/*
  - resources/**/*
  - package.json
asarUnpack:
  - "**/node_modules/sharp/**"
  - "**/node_modules/@img/**"
win:
  target:
    - target: portable
      arch: [x64]
    - target: nsis
      arch: [x64]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
mac:
  target:
    - target: dmg
      arch: [x64, arm64]
  category: public.app-category.utilities
linux:
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  category: Utility
