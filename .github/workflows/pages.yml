# Standalone version (a PWA, no PC needed): built from the same code and published to GitHub Pages.
# Run: manually (Actions -> Pages -> Run workflow) or by a push to master that changes the site
# (the github-pages environment does not allow deploying from tags).
name: Pages

on:
  push:
    branches: [master]
    paths:
      - "src/**"
      - "scripts/build-web-assets.ts"
      - "vite.web.config.ts"
      - "package.json"
      - "package-lock.json"
      - "LICENSE"
      - "THIRD-PARTY-NOTICES.md"
      - "legal/**"
      - "scripts/collect-third-party-licenses.mjs"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # without postinstall scripts: Electron and sharp are not needed for the web build
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test
      # do not download the tiles and heights every time
      - uses: actions/cache@v4
        with:
          path: .web-cache
          key: web-assets-${{ hashFiles('src/core/webMirror.ts', 'src/core/web-mod-maps.json', 'src/core/terrains-data.json', 'scripts/build-web-assets.ts') }}
      - run: npm run build:web
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out/web
      - id: deployment
        uses: actions/deploy-pages@v4
