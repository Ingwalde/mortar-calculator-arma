# Настільні збірки для macOS і Linux (Windows збирається локально: npm run dist:win).
# Запуск: вручну (Actions -> Desktop -> Run workflow). Без тегу результат лишається артефактом збірки; з тегом файли
# додаються до релізу. Збірки не підписані (macOS покаже попередження про невідомого розробника).
name: Desktop

on:
  push:
    branches: [ci/desktop-builds]
  workflow_dispatch:
    inputs:
      tag:
        description: "Тег релізу, до якого додати файли (порожньо — лише артефакт збірки)"
        required: false

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: mac-arm64
            os: macos-latest
            args: --mac dmg --arm64
            files: "dist/*.dmg"
          - name: mac-x64
            os: macos-15-intel
            args: --mac dmg --x64
            files: "dist/*.dmg"
          - name: linux-x64
            os: ubuntu-latest
            args: --linux AppImage deb --x64
            files: |
              dist/MortarTablet-*-linux-*
              dist/latest-linux.yml
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run licenses:collect
      - run: npx electron-vite build
      - run: npx electron-builder ${{ matrix.args }} --publish never
      - name: Вміст пакунка
        shell: bash
        run: ls -la dist
      - name: Перевірка юридичних файлів і бібліотеки libvips
        shell: bash
        run: |
          set -e
          found=0
          for res in dist/mac*/*.app/Contents/Resources dist/linux-unpacked/resources; do
            [ -d "$res" ] || continue
            found=1
            for f in legal/APPLICATION-LICENSE.txt legal/THIRD-PARTY-NOTICES.md legal/npm-notices.txt legal/native/SOURCE-OFFER.md legal/native/REBUILD-LIBVIPS.md legal/native/component-licenses/INDEX.md; do
              test -f "$res/$f" || { echo "У $res немає $f"; exit 1; }
            done
            n=$(ls "$res/legal/native/component-licenses" | wc -l)
            echo "$res: файлів ліцензій компонентів: $n"
            ls "$res"/app.asar.unpacked/node_modules/@img/sharp-libvips-*/lib | grep -E "libvips-cpp" || { echo "У $res немає libvips поза app.asar"; exit 1; }
          done
          [ "$found" = 1 ] || { echo "Не знайдено розпакований застосунок у dist"; exit 1; }
          echo "Ліцензії Electron у збірці:"
          els=$(find dist -name "LICENSE.electron.txt" -o -name "LICENSES.chromium.html" | wc -l)
          echo "Файлів ліцензій Electron/Chromium: $els"
          [ "$els" -ge 2 ] || { echo "Немає ліцензій Electron/Chromium"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.name }}
          path: ${{ matrix.files }}
          if-no-files-found: error
      - name: Додати до релізу
        if: ${{ inputs.tag != '' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          FILES: ${{ matrix.files }}
        run: gh release upload "$TAG" $FILES --clobber
