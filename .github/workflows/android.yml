# Android-застосунок (Capacitor): та сама автономна веб-збірка всередині APK, усе (карти, висоти) в пакеті.
# Запуск: при публікації релізу (APK додається до нього) або вручну з вказанням тегу.
name: Android

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Тег релізу, до якого додати APK (порожньо — лише артефакт збірки)"
        required: false

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci --ignore-scripts
      - uses: actions/cache@v4
        with:
          path: .web-cache
          key: web-assets-${{ hashFiles('src/core/webMirror.ts', 'src/core/web-mod-maps.json', 'src/core/terrains-data.json', 'scripts/build-web-assets.ts') }}
      - run: npm run build:web
      # деталізовані тайли (tiles-hd) лише для сайту: у пакеті Android вони зробили б APK завеликим
      - run: node -e "require('fs').rmSync('out/web/tiles-hd', { recursive: true, force: true })"
      - run: node scripts/sync-android-version.mjs
      - run: npx cap sync android
      - name: Gradle assembleRelease
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
      - name: Підпис APK
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.p12"
          UNSIGNED=android/app/build/outputs/apk/release/app-release-unsigned.apk
          "$BT/zipalign" -p -f 4 "$UNSIGNED" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/release.p12" --ks-key-alias "$KS_ALIAS" \
            --ks-pass env:KS_PASS --key-pass env:KS_PASS \
            --out "MortarTablet-$VERSION.apk" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" verify --print-certs "MortarTablet-$VERSION.apk"
          rm -f "$RUNNER_TEMP/release.p12"
          echo "APK_FILE=MortarTablet-$VERSION.apk" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: ${{ env.APK_FILE }}
      - name: Додати до релізу
        if: ${{ github.event.release.tag_name != '' || inputs.tag != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: gh release upload "$TAG" "$APK_FILE" --clobber
