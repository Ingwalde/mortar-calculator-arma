# Android app (Capacitor): the same standalone web build inside the APK, everything (maps, heights) in the package.
# Run: manually, optionally with a tag (the APK is then attached to that release). Without a tag the APK stays a build artifact.
name: Android

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach the APK to (empty: build artifact only)"
        required: false

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test
      - uses: actions/cache@v4
        with:
          path: .web-cache
          key: web-assets-${{ hashFiles('src/core/webMirror.ts', 'src/core/web-mod-maps.json', 'src/core/terrains-data.json', 'scripts/build-web-assets.ts') }}
      - run: npm run build:web
      # detailed tiles (tiles-hd) are for the site only: in the Android package they would make the APK too large
      - name: Remove detailed tiles
        run: node scripts/prune-apk-assets.mjs
      - run: node scripts/sync-android-version.mjs
      - run: npx cap sync android
      - name: Gradle assembleRelease
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
      - name: Sign the APK
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.p12"
          UNSIGNED=android/app/build/outputs/apk/release/app-release-unsigned.apk
          "$BT/zipalign" -p -f 4 "$UNSIGNED" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/release.p12" --ks-key-alias "$KS_ALIAS" \
            --ks-pass env:KS_PASS --key-pass env:KS_PASS \
            --out "MortarTablet-$VERSION.apk" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" verify --print-certs "MortarTablet-$VERSION.apk"
          rm -f "$RUNNER_TEMP/release.p12"
          echo "APK_FILE=MortarTablet-$VERSION.apk" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: ${{ env.APK_FILE }}
      - name: Attach to the release
        if: ${{ github.event.release.tag_name != '' || inputs.tag != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: gh release upload "$TAG" "$APK_FILE" --clobber
