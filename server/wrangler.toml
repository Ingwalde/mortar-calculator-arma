name = "mortar-tablet-relay"
main = "src/index.ts"
compatibility_date = "2026-10-01"

[[durable_objects.bindings]]
name = "SQUAD"
class_name = "SquadRoomDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SquadRoomDO"]

[[durable_objects.bindings]]
name = "GATE"
